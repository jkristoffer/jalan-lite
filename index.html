<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F3">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Fast Singapore bus and MRT commute checks for your saved routes.">
  <meta name="application-name" content="Jalan Lite">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jalan Lite">
  <meta name="format-detection" content="telephone=no">
  <title>Jalan Lite</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/route-shell.css">
  <style>
    body,.app-shell,.screen{min-height:100dvh}
    .screen:has(.list-lines:empty) .list-lines{margin-top:0;border-top:0;flex:1;display:flex;align-items:center;justify-content:center}
    .screen:has(.list-lines:empty) .list-lines::after{content:'No commute saved yet.';color:var(--muted);font-size:16px}
    .screen:has(.list-lines:empty) .grow{display:none}
  </style>
  <script>
    (()=>{
      const key='jalan-lite-presets-v1';
      try{
        const stored=localStorage.getItem(key);
        if(stored===null){
          localStorage.setItem(key,'[]');
          return;
        }
        const presets=JSON.parse(stored);
        const isLegacyDemo=Array.isArray(presets)&&presets.length===1&&presets[0]?.id==='morning-commute'&&presets[0]?.stopCode==='54009';
        if(isLegacyDemo)localStorage.setItem(key,'[]');
      }catch{}
    })();
  </script>
  <script src="/pwa.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <div id="app" class="screen"></div>
  </main>
  <script src="/app.js"></script>
  <script src="/route-shell.js"></script>
</body>
</html>
