<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F3">
  <title>Jalan Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'Barlow',Helvetica,sans-serif;color:#16181A;background:#E8E6E0;font-synthesis:none;--paper:#F7F6F3;--ink:#16181A;--muted:#6E7377;--soft:#9A968F;--line:#DFDDD7;--edge:#C9C6BF;--urgent:#A33A24}
    *{box-sizing:border-box} body{margin:0;min-width:320px;min-height:100vh;background:#E8E6E0;-webkit-font-smoothing:antialiased} button,input{font:inherit} button{-webkit-tap-highlight-color:transparent}.mono{font-family:'IBM Plex Mono',monospace}
    .app-shell{min-height:100vh;display:flex;justify-content:center;padding:28px 12px}.phone{width:min(390px,100%);min-height:min(844px,calc(100vh - 56px));background:var(--paper);border-radius:38px;overflow:hidden;box-shadow:0 24px 60px rgba(20,18,14,.18);display:flex;flex-direction:column}.status{display:flex;justify-content:space-between;align-items:center;padding:16px 30px 0;font-size:14px;font-weight:600}.status .mono{font-size:11px;color:var(--muted)}
    .screen{flex:1;display:flex;flex-direction:column;padding:26px 30px 0;min-height:0}.header-row{display:flex;justify-content:space-between;align-items:baseline}.eyebrow,.field-label{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.header-back{border:0;background:none;padding:6px 0;text-align:left;cursor:pointer}.text-button{border:0;background:none;font-size:15px;font-weight:500;color:var(--muted);padding:6px 0 6px 20px;cursor:pointer}
    .stop-name{margin-top:18px;font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.02em;text-wrap:pretty}.stop-code{margin-top:6px;font-size:14px;letter-spacing:.06em;color:var(--muted)}.list-lines,.arrival-list{margin-top:26px;border-top:1px solid var(--line)}.preset-row,.arrival-row{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:left;cursor:pointer}.preset-row{display:flex;flex-direction:column;gap:10px;padding:22px 0 20px}.muted-row{opacity:.62}.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.preset-title{font-size:26px;font-weight:600;letter-spacing:-.02em;text-wrap:pretty}.status-label{font-size:14px;font-weight:500;letter-spacing:.02em;white-space:nowrap}.stop-line{font-size:15px;color:var(--muted)}.row-bottom{align-items:center;margin-top:2px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--edge);display:flex;align-items:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}.window{font-size:12px;letter-spacing:.04em;color:var(--soft);white-space:nowrap}
    .arrival-row{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:16px;padding:22px 0 20px}.service-block{display:flex;flex-direction:column;gap:4px}.service-no{font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}.load{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}.arrival-block{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.first-wrap{display:flex;align-items:baseline;gap:6px}.first-arrival{font-size:66px;font-weight:600;line-height:.86;letter-spacing:-.045em;font-variant-numeric:tabular-nums}.unit{font-size:15px;font-weight:500;color:var(--muted)}.rest-arrivals{font-size:19px;font-weight:500;letter-spacing:.01em;color:#8C8880;font-variant-numeric:tabular-nums}
    .grow{flex:1}.bottom-action{padding-bottom:26px}.stacked{display:flex;flex-direction:column;gap:14px}.updated{text-align:center;font-size:12px;letter-spacing:.04em;color:var(--soft)}.error-text{text-align:center;color:var(--urgent);font-size:13px;line-height:1.35}.primary-button,.outline-button{width:100%;height:60px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;letter-spacing:.02em;cursor:pointer}.primary-button{border:1px solid var(--ink);background:var(--ink);color:var(--paper)}.primary-button:disabled{opacity:.45;cursor:not-allowed}.outline-button{border:1px solid var(--ink);background:transparent;color:var(--ink)}.home-wrap{flex:none;display:flex;justify-content:center;padding-bottom:10px}.home-indicator{width:134px;height:5px;border-radius:3px;background:#CBC8C1}
    .focus-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.focus-first-wrap{display:flex;align-items:baseline;gap:10px}.focus-first{font-size:clamp(118px,48vw,196px);font-weight:600;line-height:.78;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.focus-unit{font-size:26px;font-weight:500;color:var(--muted)}.focus-service{margin-top:26px;font-size:52px;font-weight:600;letter-spacing:-.03em;line-height:1}.focus-route{margin-top:12px;max-width:290px;text-align:center;font-size:17px;font-weight:500;line-height:1.35;color:var(--muted)}.focus-rest{margin-top:22px;font-size:18px;font-weight:500;color:var(--soft)}.focus-actions{gap:16px}.focus-tabs{justify-content:center}.focus-tab{min-width:52px;height:46px;padding:0 20px;border-radius:23px;border:1px solid var(--edge);background:transparent;color:var(--muted);font-size:17px;font-weight:600;cursor:pointer}.focus-tab.selected,.day.selected{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .edit-screen{overflow:auto}.form-stack{margin-top:24px;display:flex;flex-direction:column;gap:26px}.field{display:flex;flex-direction:column;gap:8px}.field-label{font-size:12px;color:var(--soft);letter-spacing:.12em}.line-input{border:0;border-bottom:1px solid var(--edge);background:transparent;padding:0 0 8px;color:var(--ink);width:100%;outline:none}.line-input.large{font-size:28px;font-weight:600;letter-spacing:-.01em}.line-input.time{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}.line-input.code{font-size:26px;letter-spacing:.08em}.sub-input{border:0;background:transparent;padding:2px 0 0;font-size:14px;color:var(--muted);outline:none}.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;min-width:0}.days{display:flex;gap:8px}.day{flex:1;min-width:0;height:46px;border-radius:23px;border:1px solid var(--edge);background:transparent;color:var(--soft);font-size:15px;font-weight:600;cursor:pointer}.service-editor{gap:8px}.service-pill{height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;cursor:pointer}.service-pill span{font-size:15px;font-weight:400;color:#A4A19B}.add-service{height:46px;width:88px;border-radius:23px;border:1px dashed var(--edge);background:transparent;padding:0 18px;font-size:18px;font-weight:600;outline:none}.min-grow{min-height:30px}.sticky-save{position:sticky;bottom:0;background:var(--paper);padding-top:8px}.empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;color:var(--muted);text-align:center}
    @media(max-width:430px){.app-shell{padding:0;background:var(--paper)}.phone{width:100%;min-height:100vh;border-radius:0;box-shadow:none}.screen{padding-left:24px;padding-right:24px}.status{padding-left:24px;padding-right:24px}.window{white-space:normal;text-align:right}.first-arrival{font-size:58px}.focus-first{font-size:clamp(112px,46vw,176px)}}
  </style>
</head>
<body>
  <main class="app-shell"><div class="phone"><div class="status"><span id="clock">--:--</span><span class="mono">4G</span></div><div id="app" class="screen"></div><div class="home-wrap"><div class="home-indicator"></div></div></div></main>
  <script>
  (()=>{
    const STORAGE_KEY='jalan-lite-presets-v1'; const urgent='#A33A24';
    const starter={id:'morning-commute',name:'Morning Commute',stopCode:'54009',stopName:'Blk 210 Ang Mo Kio Ave 3',services:['166','76','265'],days:[1,2,3,4,5],startTime:'07:15',endTime:'09:00'};
    const state={presets:loadPresets(),selectedId:null,view:'list',focusService:'',arrivals:[],updatedAt:null,loading:false,error:'',draft:null,draftService:''};
    state.selectedId=(state.presets.find(isActive)||state.presets[0]||{}).id||null; state.view=state.presets.find(isActive)?'main':'list';
    function loadPresets(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[starter]}catch{return[starter]}}
    function savePresets(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.presets))}
    function selected(){return state.presets.find(p=>p.id===state.selectedId)||state.presets[0]}
    function mins(t){const [h,m]=t.split(':').map(Number);return h*60+m}
    function isActive(p){const n=new Date(),d=n.getDay(),m=n.getHours()*60+n.getMinutes();return p.days.includes(d)&&m>=mins(p.startTime)&&m<=mins(p.endTime)}
    function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function daysLabel(days){if([1,2,3,4,5].every(d=>days.includes(d))&&days.length===5)return'Mon–Fri';const labels=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return days.map(d=>labels[d]).join(' · ')}
    function arrival(v){return v===null||v===undefined?'—':v===0?'Arr':String(v)}
    function updated(){return state.updatedAt?'Updated '+new Date(state.updatedAt).toLocaleTimeString('en-SG',{hour12:false}):'Not updated yet'}
    function header(label,right='',back=''){return`<div class="header-row"><button class="eyebrow header-back" data-action="${back?'back':''}" ${back?'':'disabled'}>${back?'‹ ':''}${esc(label)}</button>${right}</div>`}
    function render(){const app=document.getElementById('app');app.className='screen'+(state.view==='edit'?' edit-screen':'');if(state.view==='list')app.innerHTML=listView();else if(state.view==='main')app.innerHTML=mainView();else if(state.view==='focus')app.innerHTML=focusView();else app.innerHTML=editView();bind();}
    function listView(){return`${header('Commutes',`<button class="text-button" data-action="edit-first">Edit</button>`)}<div class="list-lines">${state.presets.map(p=>`<button class="preset-row ${isActive(p)?'':'muted-row'}" data-action="open" data-id="${p.id}"><div class="row-between"><div class="preset-title">${esc(p.name)}</div><div class="status-label" style="color:${isActive(p)?urgent:'#9A968F'}">${isActive(p)?'Active now':'Off'}</div></div><div class="stop-line">${esc(p.stopCode)} · ${esc(p.stopName)}</div><div class="row-between row-bottom"><div class="chips">${p.services.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div><div class="window mono">${esc(daysLabel(p.days))} · ${esc(p.startTime)}–${esc(p.endTime)}</div></div></button>`).join('')}</div><div class="grow"></div><div class="bottom-action"><button class="outline-button" data-action="new">New commute</button></div>`}
    function mainView(){const p=selected();if(!p)return emptyView();return`${header(p.name,`<button class="text-button" data-action="edit">Edit</button>`,'list')}<div class="stop-name">${esc(p.stopName)}</div><div class="stop-code mono">${esc(p.stopCode)}</div><div class="arrival-list">${p.services.map(no=>{const d=state.arrivals.find(x=>x.serviceNo===no)||{arrivals:[null,null,null],load:''};const first=d.arrivals[0];return`<button class="arrival-row" data-action="focus" data-service="${esc(no)}"><div class="service-block"><div class="service-no">${esc(no)}</div><div class="load">${esc(d.load||'—')}</div></div><div class="arrival-block"><div class="first-wrap"><span class="first-arrival" style="color:${first!==null&&first<=3?urgent:'#16181A'}">${arrival(first)}</span>${first!==null&&first>0?'<span class="unit">min</span>':''}</div><div class="rest-arrivals">${d.arrivals.slice(1).map(arrival).join('  ·  ')} min</div></div></button>`}).join('')}</div><div class="grow"></div><div class="bottom-action stacked">${state.error?`<div class="error-text">${esc(state.error)}</div>`:''}<div class="updated mono">${state.loading?'Updating…':esc(updated())}</div><button class="primary-button" data-action="refresh" ${state.loading?'disabled':''}>${state.loading?'Refreshing…':'Refresh'}</button></div>`}
    function focusView(){const p=selected();const d=state.arrivals.find(x=>x.serviceNo===state.focusService)||state.arrivals[0]||{serviceNo:state.focusService,arrivals:[null,null,null]};const first=d.arrivals[0];return`${header(p.name,`<button class="text-button" data-action="edit">Edit</button>`,'main')}<div class="focus-center"><div class="focus-first-wrap"><span class="focus-first" style="color:${first!==null&&first<=3?urgent:'#16181A'}">${arrival(first)}</span>${first!==null&&first>0?'<span class="focus-unit">min</span>':''}</div><div class="focus-service">${esc(d.serviceNo||'—')}</div><div class="focus-route">${esc(p.stopName)}</div><div class="focus-rest">then ${d.arrivals.slice(1).map(arrival).join('  ·  ')} min</div></div><div class="bottom-action stacked focus-actions"><div class="chips focus-tabs">${p.services.map(no=>`<button class="focus-tab ${no===d.serviceNo?'selected':''}" data-action="pick-focus" data-service="${esc(no)}">${esc(no)}</button>`).join('')}</div><div class="updated mono">${esc(updated())}</div></div>`}
    function field(label,body){return`<label class="field"><span class="field-label">${label}</span>${body}</label>`}
    function editView(){const p=state.draft||starter;const dayDefs=[[1,'M'],[2,'T'],[3,'W'],[4,'T'],[5,'F'],[6,'S'],[0,'S']];const valid=/^\d{5}$/.test(p.stopCode)&&p.services.length>0&&p.days.length>0;return`${header('Edit preset',`<button class="text-button" data-action="cancel">Cancel</button>`)}<div class="form-stack">${field('Name',`<input class="line-input large" data-field="name" value="${esc(p.name)}">`)}${field('Active days',`<div class="days">${dayDefs.map(([n,l])=>`<button class="day ${p.days.includes(n)?'selected':''}" data-action="toggle-day" data-day="${n}">${l}</button>`).join('')}</div>`)}<div class="time-grid">${field('Start',`<input class="line-input time" type="time" data-field="startTime" value="${esc(p.startTime)}">`)}${field('End',`<input class="line-input time" type="time" data-field="endTime" value="${esc(p.endTime)}">`)}</div>${field('Bus stop code',`<input class="line-input code mono" inputmode="numeric" maxlength="5" data-field="stopCode" value="${esc(p.stopCode)}"><input class="sub-input" placeholder="Stop label (optional)" data-field="stopName" value="${esc(p.stopName)}">`)}${field('Bus services',`<div class="chips service-editor">${p.services.map(no=>`<button class="service-pill" data-action="remove-service" data-service="${esc(no)}">${esc(no)}<span>×</span></button>`).join('')}<input class="add-service" data-field="draftService" placeholder="Add" value="${esc(state.draftService)}"></div>`)}</div><div class="grow min-grow"></div><div class="bottom-action sticky-save"><button class="primary-button" data-action="save" ${valid?'':'disabled'}>Save</button></div>`}
    function emptyView(){return`${header('Commutes')}<div class="empty"><div>No commute saved yet.</div><button class="primary-button" data-action="new">New commute</button></div>`}
    async function refresh(){const p=selected();if(!p)return;state.loading=true;state.error='';render();try{const q=new URLSearchParams({stopCode:p.stopCode,services:p.services.join(',')});const r=await fetch('/api/bus-arrivals?'+q);const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to load bus arrivals.');state.arrivals=data.services||[];state.updatedAt=data.updatedAt}catch(e){state.error=e.message||'Unable to load bus arrivals.'}finally{state.loading=false;render()}}
    function startEdit(p){state.draft=JSON.parse(JSON.stringify(p||selected()||starter));state.draftService='';state.view='edit';render()}
    function newPreset(){state.draft={id:'commute-'+Date.now(),name:'New commute',stopCode:'',stopName:'',services:[],days:[1,2,3,4,5],startTime:'07:30',endTime:'09:00'};state.draftService='';state.view='edit';render()}
    function addService(){const v=state.draftService.trim();if(v&&!state.draft.services.includes(v))state.draft.services.push(v);state.draftService='';render()}
    function saveDraft(){const p=state.draft;p.name=p.name.trim()||'Commute';p.stopCode=p.stopCode.trim();p.stopName=p.stopName.trim()||('Bus stop '+p.stopCode);p.services=p.services.map(s=>s.trim()).filter(Boolean);p.days=[...p.days].sort();const i=state.presets.findIndex(x=>x.id===p.id);if(i>=0)state.presets[i]=p;else state.presets.push(p);savePresets();state.selectedId=p.id;state.view='main';state.arrivals=[];render();refresh()}
    function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{const a=el.dataset.action;if(a==='open'){state.selectedId=el.dataset.id;state.focusService=selected().services[0]||'';state.view='main';state.arrivals=[];render();refresh()}else if(a==='new')newPreset();else if(a==='edit')startEdit();else if(a==='edit-first'&&state.presets[0])startEdit(state.presets[0]);else if(a==='refresh')refresh();else if(a==='focus'){state.focusService=el.dataset.service;state.view='focus';render()}else if(a==='pick-focus'){state.focusService=el.dataset.service;render()}else if(a==='back'){state.view=el.textContent.includes('Commutes')?'list':'main';render()}else if(a==='cancel'){state.view=selected()?'main':'list';render()}else if(a==='toggle-day'){const d=Number(el.dataset.day);const i=state.draft.days.indexOf(d);i>=0?state.draft.days.splice(i,1):state.draft.days.push(d);render()}else if(a==='remove-service'){state.draft.services=state.draft.services.filter(s=>s!==el.dataset.service);render()}else if(a==='save')saveDraft()}));document.querySelectorAll('[data-field]').forEach(el=>{const f=el.dataset.field;const evt=f==='draftService'?'keydown':'input';el.addEventListener(evt,e=>{if(f==='draftService'){state.draftService=e.target.value;if(e.key==='Enter'){e.preventDefault();addService()}}else if(f==='stopCode')state.draft.stopCode=e.target.value.replace(/\D/g,'').slice(0,5);else state.draft[f]=e.target.value})});const ds=document.querySelector('[data-field="draftService"]');if(ds)ds.addEventListener('blur',()=>{if(state.draftService.trim())addService()})}
    function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit',hour12:false})}
    tick();setInterval(tick,30000);render();if(state.view==='main')refresh();
  })();
  </script>
</body>
</html>
